name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          before=$(gh api "repos/$GITHUB_REPOSITORY/branches/development" --jq .commit.sha)
          gh repo sync "$GITHUB_REPOSITORY" --branch development
          after=$(gh api "repos/$GITHUB_REPOSITORY/branches/development" --jq .commit.sha)
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so start CI here.
          [ "$before" = "$after" ] || gh workflow run deadbolt-ci.yml --repo "$GITHUB_REPOSITORY" --ref development
