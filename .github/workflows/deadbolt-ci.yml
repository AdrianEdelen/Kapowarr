name: deadbolt CI

# Fork-only workflow (see FORK.md). Tests every PR into main; on pushes to
# main, tests again and publishes ghcr.io/adrianedelen/kapowarr:deadbolt.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deadbolt-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/adrianedelen/kapowarr

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Upstream's minimum, and the version the Docker image runs
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run upstream test suite
        run: |
          pip install --quiet -r requirements.txt
          mkdir -p db
          python -m unittest discover -s ./tests -p '*.py'

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:deadbolt
            ${{ env.IMAGE }}:deadbolt-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kapowarr development plus the deadbolt fixes
            org.opencontainers.image.revision=${{ github.sha }}
