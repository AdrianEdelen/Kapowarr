name: deadbolt CI

# Fork-only workflow. Tests every PR into main; on main, tests again and
# publishes ghcr.io/adrianedelen/kapowarr:deadbolt. When dispatched on
# sync/upstream (by deadbolt-sync) and green, merges the sync PR and
# dispatches itself on main: merges and pushes made with GITHUB_TOKEN don't
# trigger workflows, so the publish has to be started explicitly.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadbolt-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/adrianedelen/kapowarr

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Upstream's minimum, and the version the Docker image runs
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run upstream test suite
        run: |
          pip install --quiet -r requirements.txt
          mkdir -p db
          python -m unittest discover -s ./tests -p '*.py'

  merge-sync:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sync/upstream'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          gh pr merge sync/upstream --repo "$GITHUB_REPOSITORY" --merge
          gh workflow run deadbolt-ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=deadbolt
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
